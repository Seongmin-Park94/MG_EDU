<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>업무 FAQ 검색</title>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --line: #d8dee6;
    --accent: #2f5d8c;
    --accent-soft: #eaf1f8;
    --highlight: #fff2a8;
    --shadow: 0 8px 24px rgba(26, 45, 68, 0.07);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .app {
    max-width: 980px;
    margin: 0 auto;
    padding: 48px 24px 72px;
  }

  .header {
    margin-bottom: 24px;
  }

  .eyebrow {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: .04em;
    margin-bottom: 8px;
  }

  h1 {
    margin: 0;
    font-size: 32px;
    line-height: 1.25;
    letter-spacing: -0.03em;
  }

  .sub {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  .search-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .search-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .search-input {
    flex: 1;
    height: 48px;
    border: 1px solid #cfd6df;
    border-radius: 10px;
    padding: 0 15px;
    font-size: 15px;
    outline: none;
    background: #fff;
  }

  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(47, 93, 140, 0.12);
  }

  .all-btn {
    height: 48px;
    padding: 0 18px;
    border: 1px solid var(--accent);
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-weight: 700;
    cursor: pointer;
  }

  .all-btn:hover {
    filter: brightness(0.97);
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }

  .filter-btn {
    border: 1px solid var(--line);
    background: #fff;
    color: #4b5563;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }

  .filter-btn.active {
    background: var(--accent-soft);
    border-color: #9eb8d2;
    color: #244d75;
    font-weight: 700;
  }

  .result-head {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: center;
    margin: 28px 2px 12px;
  }

  .result-count {
    font-size: 14px;
    color: var(--muted);
  }

  .result-count strong {
    color: var(--text);
  }

  .results {
    display: grid;
    gap: 12px;
  }

  .faq-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }

  .category {
    display: inline-flex;
    align-items: center;
    min-height: 26px;
    padding: 4px 9px;
    border-radius: 999px;
    background: #eef2f6;
    color: #4b5563;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 11px;
  }

  .question {
    margin: 0;
    font-size: 17px;
    line-height: 1.55;
    font-weight: 750;
  }

  .answer {
    margin: 10px 0 0;
    color: #46515d;
    font-size: 14px;
    line-height: 1.7;
  }

  mark {
    background: var(--highlight);
    color: inherit;
    padding: 0 2px;
    border-radius: 2px;
  }

  .empty {
    background: var(--panel);
    border: 1px dashed #c9d1db;
    border-radius: 14px;
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
  }

  @media (max-width: 640px) {
    .app {
      padding: 28px 16px 52px;
    }
    h1 {
      font-size: 27px;
    }
    .search-row {
      flex-direction: column;
      align-items: stretch;
    }
    .all-btn {
      width: 100%;
    }
  }
</style>
</head>
<body>
  <main class="app">
    <section class="header">
      <div class="eyebrow">INTERNAL FAQ</div>
      <h1>업무 FAQ 검색</h1>
      <p class="sub">질문이나 키워드를 입력하거나 분류를 선택해 필요한 FAQ를 빠르게 찾으세요.</p>
    </section>

    <section class="search-panel" aria-label="FAQ 검색 및 필터">
      <div class="search-row">
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="질문이나 키워드를 입력하세요."
          aria-label="FAQ 검색"
          autocomplete="off"
        />
        <button id="showAllBtn" class="all-btn" type="button">전체보기</button>
      </div>

      <div class="filters" id="filters" aria-label="분류">
        <button class="filter-btn active" data-category="전체" type="button">전체</button>
        <button class="filter-btn" data-category="교육" type="button">교육</button>
        <button class="filter-btn" data-category="문서" type="button">문서</button>
        <button class="filter-btn" data-category="IT" type="button">IT</button>
        <button class="filter-btn" data-category="보안" type="button">보안</button>
      </div>
    </section>

    <section class="result-head">
      <div class="result-count" id="resultCount" aria-live="polite"></div>
    </section>

    <section class="results" id="results" aria-live="polite"></section>
  </main>

<script>
  const faqData = [{"category": "교육", "question": "교육 신청은 어디에서 하나요?", "answer_seed": "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다."}, {"category": "교육", "question": "신청한 교육을 취소하려면 어떻게 하나요?", "answer_seed": "신청내역에서 취소 가능 여부를 확인합니다."}, {"category": "문서", "question": "주간 업무보고에는 무엇을 넣어야 하나요?", "answer_seed": "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다."}, {"category": "IT", "question": "사내 시스템 접속이 되지 않습니다.", "answer_seed": "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다."}, {"category": "보안", "question": "ChatGPT에 내부 업무자료를 넣어도 되나요?", "answer_seed": "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다."}];

  const searchInput = document.getElementById('searchInput');
  const filters = document.getElementById('filters');
  const results = document.getElementById('results');
  const resultCount = document.getElementById('resultCount');
  const showAllBtn = document.getElementById('showAllBtn');

  let activeCategory = '전체';

  function escapeHtml(value) {
    return String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function escapeRegExp(value) {
    return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function highlight(text, keyword) {
    const safeText = escapeHtml(text);
    const trimmed = keyword.trim();
    if (!trimmed) return safeText;

    const regex = new RegExp(`(${escapeRegExp(trimmed)})`, 'gi');
    return safeText.replace(regex, '<mark>$1</mark>');
  }

  function render() {
    const keyword = searchInput.value.trim().toLowerCase();

    const filtered = faqData.filter(item => {
      const categoryMatch =
        activeCategory === '전체' || item.category === activeCategory;

      const searchable = `${item.question} ${item.answer_seed} ${item.category}`.toLowerCase();
      const keywordMatch = !keyword || searchable.includes(keyword);

      return categoryMatch && keywordMatch;
    });

    resultCount.innerHTML = `검색 결과 <strong>${filtered.length}</strong>건`;

    if (filtered.length === 0) {
      results.innerHTML = `
        <div class="empty">
          조건에 맞는 FAQ가 없습니다.<br />
          다른 검색어나 분류를 선택해 주세요.
        </div>
      `;
      return;
    }

    const rawKeyword = searchInput.value.trim();

    results.innerHTML = filtered.map(item => `
      <article class="faq-card">
        <div class="category">${highlight(item.category, rawKeyword)}</div>
        <h2 class="question">${highlight(item.question, rawKeyword)}</h2>
        <p class="answer">${highlight(item.answer_seed, rawKeyword)}</p>
      </article>
    `).join('');
  }

  searchInput.addEventListener('input', render);

  filters.addEventListener('click', event => {
    const btn = event.target.closest('.filter-btn');
    if (!btn) return;

    activeCategory = btn.dataset.category;

    document.querySelectorAll('.filter-btn').forEach(button => {
      button.classList.toggle('active', button === btn);
    });

    render();
  });

  showAllBtn.addEventListener('click', () => {
    searchInput.value = '';
    activeCategory = '전체';

    document.querySelectorAll('.filter-btn').forEach(button => {
      button.classList.toggle('active', button.dataset.category === '전체');
    });

    render();
    searchInput.focus();
  });

  render();
</script>
</body>
</html>
